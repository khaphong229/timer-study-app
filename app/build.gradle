plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
}

android {
    namespace 'com.example.timerstudy'
    compileSdk 35

    defaultConfig {
        applicationId "com.domin.timerstudy"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Load Facebook credentials from local.properties
        Properties properties = new Properties()
        if (rootProject.file("local.properties").exists()) {
            properties.load(rootProject.file("local.properties").newDataInputStream())
        }

        // Set as build config fields or resources
        resValue "string", "facebook_app_id", properties.getProperty("facebook.app_id", "")
        resValue "string", "facebook_client_token", properties.getProperty("facebook.client_token", "")
        resValue "string", "fb_login_protocol_scheme", "fb" + properties.getProperty("facebook.app_id", "")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
    defaultConfig {
        vectorDrawables.useSupportLibrary = true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    
    // Room database
    implementation libs.room.runtime
    implementation libs.room.ktx
    implementation libs.recyclerview
    implementation libs.cardview
    implementation libs.firebase.auth
    annotationProcessor libs.room.compiler
    
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    
    // Room components
    implementation "androidx.room:room-runtime:2.5.0"
    annotationProcessor "androidx.room:room-compiler:2.5.0"
    
    // Room with LiveData
    implementation "androidx.room:room-ktx:2.5.0"
    
    // Glide for loading GIF images
 implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.25'

    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0-alpha01"

    implementation 'com.google.code.gson:gson:2.10.1'
    
    implementation 'com.google.android.gms:play-services-ads:22.6.0'

    implementation 'com.facebook.android:facebook-android-sdk:latest.release'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
}
